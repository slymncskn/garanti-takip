name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; üst üste gelen push'larda sonuncusu kazanır.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Derle
        run: npm run build
        env:
          # Taban yol depo adından türetiliyor; depoyu yeniden adlandırırsan
          # elle bir şey değiştirmen gerekmiyor.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # VITE_ önekli değişkenler pakete gömülür — bu tasarım gereği.
          # Buraya service_role anahtarı ya da n8n sırrı ASLA konmaz;
          # n8n bildirimi Edge Function üzerinden gidiyor.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
